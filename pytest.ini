[pytest]
# Configuração global básica - serviços específicos devem ter seus próprios pytest.ini
addopts =
    -ra
    -q
    --strict-markers

# Ignorar pastas comuns
norecursedirs =
    .git
    .tox
    dist
    build
    migrations
    htmlcov
    .pytest_cache
    __pycache__
    venv
    env
    .venv
    .env
    node_modules
    frontend

# Configurações de descoberta de testes
python_files = test_*.py
python_classes = Test*
python_functions = test_*
