[tool:pytest]
# Mostra logs no console durante os testes
addopts =
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    -ra
    -q
    --strict-markers

# Ignorar pastas e arquivos desnecessários nos testes
norecursedirs =
    .git
    .tox
    dist
    build
    migrations
    htmlcov
    .pytest_cache
    __pycache__
    venv
    env
    .venv
    .env

# Configurações de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
