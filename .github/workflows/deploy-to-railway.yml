name: Deploy to Railway

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Test Menu Service
        run: |
          cd services/menu-service
          pip install -r requirements.txt
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/../.."
          python -m pytest tests/ -v

      - name: Test Order Service
        run: |
          cd services/order-service
          pip install -r requirements.txt
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/../.."
          python -m pytest tests/ -v

      - name: Test Payment Service
        run: |
          cd services/payment-service
          pip install -r requirements.txt
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/../.."
          python -m pytest tests/ -v

  deploy-menu-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy shared folder to menu-service
        run: |
          echo "Copiando pasta shared para menu-service..."
          cp -r ./shared ./services/menu-service/
          echo "Estrutura do menu-service após cópia:"
          ls -la ./services/menu-service/

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Menu Service
        run: |
          railway up --service menu-service --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-order-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy shared folder to order-service
        run: |
          echo "Copiando pasta shared para order-service..."
          cp -r ./shared ./services/order-service/
          echo "Estrutura do order-service após cópia:"
          ls -la ./services/order-service/

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Order Service
        run: |
          cd services/order-service
          railway up --service order-service --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-payment-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy shared folder to payment-service
        run: |
          echo "Copiando pasta shared para payment-service..."
          cp -r ./shared ./services/payment-service/
          echo "Estrutura do payment-service após cópia:"
          ls -la ./services/payment-service/

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Payment Service
        run: |
          cd services/payment-service
          railway up --service payment-service --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set working directory
        run: cd frontend

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
