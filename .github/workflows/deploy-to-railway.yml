name: Deploy to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Test Menu Service
        run: |
          cd services/menu-service
          pip install -r requirements.txt
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/../.."
          python -m pytest tests/ -v

      - name: Test Order Service
        run: |
          cd services/order-service
          pip install -r requirements.txt
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/../.."
          python -m pytest tests/ -v

      - name: Test Payment Service
        run: |
          cd services/payment-service
          pip install -r requirements.txt
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/../.."
          python -m pytest tests/ -v

  prepare-shared:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      shared-ready: ${{ steps.prepare.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare shared artifact
        id: prepare
        run: |
          # Verifica se o shared existe e tem conteúdo
          if [ -d "./shared" ] && [ "$(ls -A ./shared)" ]; then
            echo "Shared directory is ready"
            echo "ready=true" >> $GITHUB_OUTPUT

            # Cria um checksum do shared para verificação
            find ./shared -type f -name "*.py" -exec md5sum {} \; | sort > shared_checksum.txt
            echo "Shared files checksum:"
            cat shared_checksum.txt
          else
            echo "Shared directory missing or empty"
            echo "ready=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  deploy-menu-service:
    runs-on: ubuntu-latest
    needs: [test, prepare-shared]
    steps:
      - uses: actions/checkout@v4

      - name: Verify shared integrity
        run: |
          echo "🔍 Verificando integridade do shared..."
          if [ ! -d "./shared" ] || [ -z "$(ls -A ./shared)" ]; then
            echo "ERROR: Shared directory is missing or empty after checkout"
            ls -la ./
            exit 1
          fi

      - name: Copy shared to menu-service
        run: |
          echo "Copiando shared para menu-service..."
          mkdir -p ./services/menu-service/shared
          cp -r ./shared/* ./services/menu-service/shared/

          # Verifica se a cópia foi bem sucedida
          if [ -d "./services/menu-service/shared" ] && [ "$(ls -A ./services/menu-service/shared)" ]; then
            echo "Shared copiado com sucesso para menu-service"
          else
            echo "Falha ao copiar shared para menu-service"
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Menu Service
        run: railway up --service menu-service --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-order-service:
    runs-on: ubuntu-latest
    needs: [test, prepare-shared]
    steps:
      - uses: actions/checkout@v4

      - name: Verify shared integrity
        run: |
          echo "🔍 Verificando integridade do shared..."
          if [ ! -d "./shared" ] || [ -z "$(ls -A ./shared)" ]; then
            echo "ERROR: Shared directory is missing or empty after checkout"
            ls -la ./
            exit 1
          fi

      - name: Copy shared to order-service
        run: |
          echo "Copiando shared para order-service..."
          mkdir -p ./services/order-service/shared
          cp -r ./shared/* ./services/order-service/shared/

          # Verifica se a cópia foi bem sucedida
          if [ -d "./services/order-service/shared" ] && [ "$(ls -A ./services/order-service/shared)" ]; then
            echo "Shared copiado com sucesso para order-service"
          else
            echo "Falha ao copiar shared para order-service"
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Order Service
        run: railway up --service order-service --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-payment-service:
    runs-on: ubuntu-latest
    needs: [test, prepare-shared]
    steps:
      - uses: actions/checkout@v4

      - name: Verify shared integrity
        run: |
          echo "🔍 Verificando integridade do shared..."
          if [ ! -d "./shared" ] || [ -z "$(ls -A ./shared)" ]; then
            echo "ERROR: Shared directory is missing or empty after checkout"
            ls -la ./
            exit 1
          fi

      - name: Copy shared to payment-service
        run: |
          echo "Copiando shared para payment-service..."
          mkdir -p ./services/payment-service/shared
          cp -r ./shared/* ./services/payment-service/shared/

          # Verifica se a cópia foi bem sucedida
          if [ -d "./services/payment-service/shared" ] && [ "$(ls -A ./services/payment-service/shared)" ]; then
            echo "Shared copiado com sucesso para payment-service"
          else
            echo "Falha ao copiar shared para payment-service"
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Payment Service
        run: railway up --service payment-service --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set working directory
        run: cd frontend

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
